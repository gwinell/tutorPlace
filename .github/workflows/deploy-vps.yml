name: Deploy to NixOS VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codetogether-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the VPS release build
        id: release
        shell: bash
        run: |
          if [ -f scripts/build.mjs ] && node -e "process.exit(require('./package.json').scripts?.build === 'node scripts/build.mjs' ? 0 : 1)"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deployment is enabled after the Node standalone build is merged to main."
          fi
      - uses: actions/setup-node@v4
        if: steps.release.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.release.outputs.ready == 'true'
        run: npm ci
      - if: steps.release.outputs.ready == 'true'
        run: npm run check
      - if: steps.release.outputs.ready == 'true'
        run: npm run lint
      - if: steps.release.outputs.ready == 'true'
        run: npm test
      - if: steps.release.outputs.ready == 'true'
        run: npm run build
      - if: steps.release.outputs.ready == 'true'
        run: npm run test:typing-api
      - name: Package standalone release
        if: steps.release.outputs.ready == 'true'
        run: tar -czf "codetogether-${GITHUB_SHA}.tar.gz" -C dist/standalone .
      - name: Install deployment key
        if: steps.release.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/codetogether_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/codetogether_deploy ~/.ssh/known_hosts
      - name: Package signed NixOS configuration
        if: steps.release.outputs.ready == 'true'
        env:
          NIXOS_CONFIG_SIGNING_KEY: ${{ secrets.NIXOS_CONFIG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          signing_key="$RUNNER_TEMP/codetogether_nixos_signing_key"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s\n' "$NIXOS_CONFIG_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"
          bundle="$RUNNER_TEMP/codetogether-nixos"
          mkdir -p "$bundle/infra/nixos"
          cp infra/nixos/codetogether.nix infra/nixos/qumir.nix "$bundle/infra/nixos/"
          printf '%s\n' "$GITHUB_SHA" > "$bundle/RELEASE_SHA"
          nixos_archive="codetogether-nixos-${GITHUB_SHA}.tar.gz"
          tar -czf "$nixos_archive" -C "$bundle" RELEASE_SHA infra/nixos/codetogether.nix infra/nixos/qumir.nix
          ssh-keygen -Y sign -n codetogether-nixos -f "$signing_key" "$nixos_archive"
      - name: Upload and activate release
        if: steps.release.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          archive="codetogether-${GITHUB_SHA}.tar.gz"
          nixos_archive="codetogether-nixos-${GITHUB_SHA}.tar.gz"
          scp -i ~/.ssh/codetogether_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$archive" "$nixos_archive" "$nixos_archive.sig" "$VPS_USER@$VPS_HOST:/tmp/"
          r2_configured=false
          if [[ -n "$R2_ACCOUNT_ID" || -n "$R2_ACCESS_KEY_ID" || -n "$R2_SECRET_ACCESS_KEY" || -n "$R2_BUCKET_NAME" ]]; then
            if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_BUCKET_NAME" ]]; then
              echo "All four R2 repository secrets must be set together." >&2
              exit 1
            fi
            r2_configured=true
          fi
          ssh -i ~/.ssh/codetogether_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sudo -n \$(readlink -f /run/current-system/sw/bin/codetogether-config-deploy) ${GITHUB_SHA}"
          if [[ "$r2_configured" == true ]]; then
            printf '%s\n' "$R2_ACCOUNT_ID" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" "$R2_BUCKET_NAME" | ssh -i ~/.ssh/codetogether_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sudo -n \$(readlink -f /run/current-system/sw/bin/codetogether-r2-secrets-deploy)"
          fi
          ssh -i ~/.ssh/codetogether_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sudo -n \$(readlink -f /run/current-system/sw/bin/codetogether-deploy) ${GITHUB_SHA} && curl --fail --silent http://127.0.0.1:3101/health && curl --fail --silent http://127.0.0.1:3000/api/health"

      - name: Smoke test public demo Qumir compilation
        if: steps.release.outputs.ready == 'true'
        shell: bash
        run: |
          wasm="$RUNNER_TEMP/demo-kumir-smoke.wasm"
          trap 'rm -f "$wasm"' EXIT
          content_type=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            --output "$wasm" --write-out '%{content_type}' \
            --header 'Origin: https://code-together.ru' \
            --header 'Content-Type: application/json' \
            --data-binary '{"code":"алг main\nнач\nкон"}' \
            https://code-together.ru/api/demo/compile-kumir)
          if [[ "$content_type" != 'application/wasm' || ! -s "$wasm" ]]; then
            echo "Demo compiler returned an unexpected response (content type: $content_type)." >&2
            exit 1
          fi
          wasm_magic=$(od -An -tx1 -N8 "$wasm" | tr -d '[:space:]')
          if [[ "$wasm_magic" != '0061736d01000000' ]]; then
            echo 'Demo compiler response is not a valid WebAssembly module.' >&2
            exit 1
          fi
          echo 'Public demo Qumir compilation returned WebAssembly.'

      - name: Verify public pages and log response times
        if: steps.release.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/codetogether-public-page.html"
          trap 'rm -f "$body_file"' EXIT
          routes=(
            '/|Разобраться в коде.'
            '/python|Индивидуальные занятия по Python'
            '/oge-informatika|Подготовка к ОГЭ по информатике'
            '/ege-informatika|Подготовка к ЕГЭ по информатике'
            '/mcko-informatika|Подготовка к диагностике МЦКО по информатике'
            '/sitemap.xml|https://code-together.ru/python'
            '/robots.txt|Disallow: /api/'
          )
          for route in "${routes[@]}"; do
            path="${route%%|*}"
            expected="${route#*|}"
            result=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$body_file" --write-out '%{http_code} %{time_starttransfer} %{time_total}' \
              "https://code-together.ru${path}")
            read -r status response_time total_time <<< "$result"
            printf 'Public GET %s: HTTP %s, first byte %ss, total %ss\n' \
              "$path" "$status" "$response_time" "$total_time"
            if ! grep --fixed-strings --quiet "$expected" "$body_file"; then
              echo "Expected public content missing from ${path}." >&2
              exit 1
            fi
            if [[ "$path" == '/robots.txt' ]] && ! grep --fixed-strings --quiet 'Disallow: /?demo=' "$body_file"; then
              echo 'robots.txt no longer disallows demo routes.' >&2
              exit 1
            fi
          done

name: Verify pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codetogether-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Parse NixOS service configuration
        run: nix-instantiate --parse infra/nixos/codetogether.nix >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the Python course seed is reproducible
        run: npm run course:python:seed && git diff --exit-code -- drizzle/0014_python_course_seed.sql
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run test:backup-snapshot
      - run: npm run build
      - run: npm run test:assignment-images-api
      - run: npm run test:typing-api
      - name: Apply disposable local SQLite migrations
        run: DATABASE_PATH=.data/ci.sqlite npm run db:migrate:sqlite
      - name: Start local app for integration checks
        shell: bash
        run: |
          DATABASE_PATH=.data/ci.sqlite npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/tutorplace-dev.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/tutorplace-dev.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/tutorplace-dev.log"
          exit 1
      - name: Check public SEO pages, robots, sitemap, and structured data
        run: npm run test:seo-pages
      - name: Stop local app
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/tutorplace-dev.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/tutorplace-dev.pid")" 2>/dev/null || true
          fi
